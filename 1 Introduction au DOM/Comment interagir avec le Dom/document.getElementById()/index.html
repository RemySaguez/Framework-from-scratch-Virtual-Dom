
<!-- document.getElementById() Son rôle est de récupérer un élément HTML unique à partir de son attribut id.
Syntaxe : const element = document.getElementById('monId'); -->

<div id="contenu">Bonjour le monde !</div>

<script>
    
const div = document.getElementById('contenu');
console.log(div.textContent); // Affiche dans la console : "Bonjour le monde !"

</script>
