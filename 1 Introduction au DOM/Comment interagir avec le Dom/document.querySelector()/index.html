<!-- document.querySelector() Son rôle est de récupérer le premier élément correspondant à un sélecteur CSS.
Syntaxe : const element = document.querySelector('selecteurCSS'); -->

<ul>
  <li class="item">Item 1</li>
  <li class="item">Item 2</li>
</ul>

<script>
    const premierItem = document.querySelector('.item');
    console.log(premierItem.textContent); // Affiche dans la console : "Item 1"

</script>
