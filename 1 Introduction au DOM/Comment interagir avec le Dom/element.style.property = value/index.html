<!--element.style.property = value Son rôle est de modifier dynamiquement le style CSS d’un élément via JavaScript.
 Syntaxe : element.style.proprieteCSS = 'valeur';-->

 <p id="texte">Ce texte va changer de couleur.</p>

 <script>
    const paragraphe = document.getElementById('texte');
    paragraphe.style.color = 'red';
    paragraphe.style.fontSize = '20px';
 </script>
